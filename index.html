<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="description" content="每日單字練習與間隔複習">
  <title>字日 Words — 每日單字練習</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="字日首頁"><span class="brand-mark">字</span><span>字日 <small>WORDS, DAILY</small></span></a>
    <div class="top-meta"><span class="today" id="today"></span><button class="small-action" id="export-button" type="button">匯出進度</button><label class="small-action import-action">匯入進度<input id="import-file" type="file" accept="application/json,.json" hidden></label><button class="icon-button" id="reset-button" title="重設本機進度" aria-label="重設本機進度">↻</button></div>
  </header>

  <main class="layout">
    <section class="intro">
      <div class="eyebrow"><span class="live-dot"></span> YOUR DAILY PRACTICE</div>
      <h1>讓每天的幾個單字，<br><em>慢慢變成你的。</em></h1>
      <p>新字配上適時複習，今天花一點時間，記得更久一點。</p>
    </section>

    <section class="stats" aria-label="學習統計">
      <div class="stat"><span class="stat-icon">✳</span><div><strong id="learned-count">0</strong><span>已學單字</span></div></div>
      <div class="stat"><span class="stat-icon">◷</span><div><strong id="due-count">0</strong><span>今日待複習</span></div></div>
      <div class="stat"><span class="stat-icon">♧</span><div><strong id="streak-count">0</strong><span>連續練習天數</span></div></div>
    </section>

    <section class="practice-panel" id="practice-panel">
      <div class="panel-head"><div><div class="eyebrow" id="session-label">TODAY'S SESSION</div><h2 id="session-title">今天的單字</h2></div><div class="panel-tools"><label class="mode-picker">新字數量<select id="daily-limit" aria-label="選擇每日新字數"><option value="3">3 個</option><option value="5">5 個</option><option value="8">8 個</option></select></label><label class="mode-picker">新字主題<select id="topic-filter" aria-label="選擇新字主題"><option value="all">全部</option><option value="communication">溝通表達</option><option value="thinking">思考判斷</option><option value="growth">成長行動</option></select></label><label class="mode-picker">練習方向<select id="quiz-mode" aria-label="選擇練習方向"><option value="englishToChinese">英翻中</option><option value="chineseToEnglish">中翻英</option></select></label><span class="progress-label" id="progress-label"></span></div></div>
      <p class="settings-hint">新字數量與主題設定於下一日生效；今天的練習佇列會保持不變。</p>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <article class="word-card" id="word-card" aria-live="polite"></article>
      <div class="actions" id="actions"></div>
    </section>

    <section class="queue-note"><span class="note-icon">↗</span><p><strong>循序複習</strong><br>標記「熟悉」的單字會在兩天後回來；「再練一次」的單字明天就會再見。</p><span class="note-side">依你的節奏<br>安排複習</span></section>
    <footer><span>字日 WORDS</span><span>一點一滴，記得更久。</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
